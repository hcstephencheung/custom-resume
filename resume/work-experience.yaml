# Stephen Cheung: the bank of work experience that personalized resumes are
# built from. It holds every role, personal project and bullet worth keeping,
# including alternative wordings of the same work; a tailored resume
# (resume/<name>.resume.yaml) copies the roles and projects it needs and only
# the bullets that fit the posting.
#
# Entries use the same shape as `experience` and `projects` in a resume spec,
# so they can be copied in as they are. Bullet ids are unique across the bank;
# a reworded variant gets its own id (bestbuy-tracking and
# bestbuy-tracking-reports).
# Add new or reworded bullets here first, then select them into a resume.
#
# Started from main-resume's experience, plus the reworded Best Buy tracking
# bullet from ashby-personalized and the Sunday personal project. It holds no
# contact details, so unlike the resumes it is committed.

experience:
  - id: findem
    company: Findem
    title: Senior Software Engineer
    start: 2025-04
    location: Vancouver, B.C.
    tags: [fullstack, ai, observability, leadership]
    stack: [TypeScript, React, Node.js, MongoDB, Docker Swarm]
    bullets:
      - id: findem-tracing
        text: >-
          Architected and implemented distributed tracing across the platform,
          then used it to isolate and fix a long-standing memory issue, cutting
          first-load API latency from 30 seconds to 5.
        tags: [observability, distributed-tracing, architecture, performance, debugging, backend]
      - id: findem-features
        text: >-
          Delivered features like consumption-based pricing, outreach redesign
          built on new system definitions, and AI-summarized candidate profile
          search — owning system design, implementation, and rollout for each.
        tags: [fullstack, ai, system-design, product]
      - id: findem-culture
        text: >-
          Led and established professional engineering team culture: recurring
          product demo cadence, AI-generated diagrams for architecture reviews,
          post-mortem reviews, and regular knowledge sharing.
        tags: [leadership, culture, process]

