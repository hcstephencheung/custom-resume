# Mock content for previewing the personalized-three-column template:
#   resume preview templates/personalized-three-column
# resume.typ also falls back to this file when compiled directly with Typst.
#
# Top section: name, headline, subheadline and `summary`.
# Left column: `skills` and `education`.
# Middle column: `experience` as a timeline, a bullet or so per role.
# Right column: `contact` and `interests`.
# Full-width row under the columns: `personalized` (shown as "Why I'm a fit"),
# a paragraph or a list of points.
# Any company from `experience` mentioned in the summary or the points is
# highlighted.
# Bottom margin: `disclaimer`, one line.

