# Mock content for previewing the personalized-three-column template:
#   resume preview templates/personalized-three-column
# resume.typ also falls back to this file when compiled directly with Typst.
#
# Top section: name, headline, subheadline, summary.
# Full-width row: `personalized` (shown as "Why I'm a fit"): a paragraph, or a
# list of points, each plain text or `company` + `text`, where the text mentions
# the company and each mention is highlighted.
# Left column: `contact` and `education`.
# Right column: `experience` as a timeline of roles (bullets aren't shown), then
# `skills` and `interests`.
# Bottom margin: `disclaimer`, one line.

